# SonarQube Configuration for Node.js/TypeScript Hexagonal Architecture

# Project identification
sonar.projectKey=arch-back-node-ms-hexag
sonar.projectName=Architecture Backend Node.js Microservice Hexagonal
sonar.projectVersion=1.0.0
sonar.organization=your-organization

# Source and test directories
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts,**/*.test.ts,**/*.spec.ts

# Language settings
sonar.language=ts
sonar.typescript.node=node
sonar.nodejs.executable=node
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage and test execution reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-results.json
sonar.coverageReportPaths=coverage/coverage-final.json

# Exclusions for coverage
sonar.coverage.exclusions=\
  **/*.config.ts,\
  **/*.config.js,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/index.ts,\
  **/index.js,\
  **/*.interface.ts,\
  **/*.type.ts,\
  **/*.enum.ts,\
  **/*.constant.ts,\
  **/migrations/**,\
  **/seeds/**,\
  **/*.mock.ts,\
  **/*.stub.ts,\
  tests/**

# Exclusions for code analysis
sonar.exclusions=\
  **/*.config.ts,\
  **/*.config.js,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/*.json,\
  **/*.md,\
  **/.github/**,\
  **/Dockerfile,\
  **/docker-compose.yml,\
  **/serverless.yml,\
  **/.eslintrc.js,\
  **/.prettierrc

# Duplication exclusions
sonar.cpd.exclusions=\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.d.ts,\
  **/*.interface.ts,\
  **/*.type.ts,\
  **/*.enum.ts,\
  **/*.constant.ts,\
  tests/**/*.mock.ts,\
  tests/**/*.stub.ts

# Quality gate thresholds
sonar.qualitygate.wait=true

# Coverage thresholds
sonar.coverage.minimum=80.0
sonar.coverage.exclusions.minimum=90.0

# Technical debt
sonar.debt.sqaleRating=A
sonar.debt.sqaleIndex=<30min

# Maintainability
sonar.maintainability.rating=A
sonar.maintainability.debt.ratio=<5.0%

# Security
sonar.security.rating=A
sonar.security.hotspots.reviewed=100%

# Reliability
sonar.reliability.rating=A

# Thresholds for new code
sonar.new_code.coverage=80.0
sonar.new_code.duplicated_lines_density=3.0
sonar.new_code.maintainability_rating=A
sonar.new_code.reliability_rating=A
sonar.new_code.security_rating=A

# Complexity thresholds
sonar.complexity.threshold=10
sonar.complexity.functions=10
sonar.complexity.file=200

# Duplication thresholds
sonar.duplicated_lines_density=3.0
sonar.duplicated_blocks=0

# Issues thresholds
sonar.bugs=0
sonar.vulnerabilities=0
sonar.code_smells=0
sonar.security_hotspots=0

# Additional TypeScript/Node.js specific settings
sonar.typescript.eslint.reportPaths=coverage/eslint-report.json
sonar.javascript.environments=node,jest,vitest

# Working directory
sonar.working.directory=.sonarqube

# Analysis parameters
sonar.analysis.mode=publish
sonar.buildString=${BUILD_NUMBER}
sonar.scm.provider=git
sonar.scm.forceReloadAll=true

# Logging
sonar.log.level=INFO
sonar.verbose=false

# Performance
sonar.scanner.metadataFilePath=.sonarqube/report-task.txt